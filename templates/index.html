<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h1 class="text-center mb-4">🚀 Smart Task Manager !!</h1>
        <h1 class="text-center mb-4">🚀 Daggubati Venkat Rao !!</h1>
         <h1 class="text-center mb-4">🚀 2nd Week Task-2 !!</h1>

        <form method="POST" class="d-flex gap-2 mb-4">
            <input 
                type="text" 
                name="task"
                class="form-control"
                placeholder="Enter a task..."
                required>
            <button class="btn btn-primary">Add</button>
        </form>

        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between">

                <span class="{{ 'text-decoration-line-through text-muted' if task.completed }}">
                    {{ task.title }}
                </span>

                <div>
                    {% if not task.completed %}
                        <a href="/complete/{{ loop.index0 }}" class="btn btn-success btn-sm">
                            Complete
                        </a>
                    {% endif %}

                    <a href="/delete/{{ loop.index0 }}" class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </div>

            </li>
            {% endfor %}
        </ul>

    </div>
</div>

</body>
</html>
